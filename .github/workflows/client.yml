# Client CI (docs/PLAN.md §10.5): content gates → headless selftest → web export →
# brotli → Cloudflare Pages. The Godot binary and the 4.7.2 web templates are cached —
# the templates archive is 1.28 GB, so the cache key carries the version.
name: client

on:
  push:
    branches: [main]
    paths: ["client/**", "tools/**", ".github/workflows/client.yml"]

jobs:
  test-export-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bun 1.4.4 (runs the content gate)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The gate imports @hkstories/core, so the workspace has to be installed first.
      - name: Install the workspace
        run: bun install --frozen-lockfile

      - name: Content validator + font coverage
        run: |
          bun tools/check_content.ts
          bun tools/check_font_coverage.ts

      - name: Cache Godot 4.7.2 + web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-v1

      - name: Install Godot 4.7.2 + web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          curl -L --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          BIN=$(find /tmp/godot -name 'Godot_v4.7.2*' -type f | head -1)
          mv "$BIN" /opt/godot/godot && chmod +x /opt/godot/godot
          curl -L --fail -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -o -j -q /tmp/templates.tpz "templates/version.txt" \
            "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" \
            -d ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Import + selftest (headless, exit code = failures)
        run: |
          /opt/godot/godot --headless --path client --import
          /opt/godot/godot --headless --path client -- --selftest

      - name: Export web
        run: GODOT=/opt/godot/godot tools/export_web.sh

      - name: Browser smokes (boot + offline talk)
        run: |
          bun tools/serve_web.ts 8099 & SERVER_PID=$!
          sleep 2
          CHROME=$(which google-chrome-stable) node tools/web_smoke.mjs \
            http://127.0.0.1:8099/ /tmp/smoke_boot.png 25000 boot
          CHROME=$(which google-chrome-stable) node tools/web_smoke.mjs \
            http://127.0.0.1:8099/ /tmp/smoke_talk.png 25000 talk
          kill $SERVER_PID

      - name: Brotli pre-compress
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli
          cd build/web && for f in *.wasm *.pck *.js *.html; do brotli --force --best "$f"; done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=hongkong-stories --branch=main