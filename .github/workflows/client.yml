# Client CI (docs/PLAN.md §10.5): content gates → type-check → unit tests → browser verification →
# Cloudflare Pages. The Godot export pipeline lives in client-godot.yml and only runs when
# dispatched: it still publishes the reference build to production, because that is where the game
# currently lives and this client is not yet at parity.
name: client

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "packages/core/**"
      - "client/content/**"
      - "client/assets/**"
      - "tools/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - "packages/core/**"
      - "client/content/**"

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The client imports @hkstories/core and reads the pack, so the workspace has to be installed
      # and the gates have to run first: content that cannot publish must not reach a build.
      - name: Install the workspace
        run: bun install --frozen-lockfile

      - name: Content validator + font coverage
        run: |
          bun tools/check_content.ts
          bun tools/check_font_coverage.ts

      - name: Type-check and unit tests
        working-directory: apps/client
        run: |
          bun run check
          bun test

      # This builds the bundle itself, then serves it and drives chromium: the four checks assert
      # NPC gating, the conversation loop, world interaction and the quest/cutscene chain.
      - name: Browser verification
        run: |
          npm install -g @playwright/cli
          playwright-cli install-browser chrome-for-testing
          bash apps/client/scripts/verify.sh

      - name: Deploy the bundle to Cloudflare Pages
        # A preview alias, not the production root: this client has no inventory screen or dev
        # console yet, and `main` still serves the Godot build. Flipping this branch to `main` is the
        # whole switch once parity is reached.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/client/dist --project-name=hongkong-stories --branch=phaser
