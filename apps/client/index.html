<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No favicon request: a data URI stops the browser asking for /favicon.ico, which a
         static host would then 404 in every visitor's console. -->
    <link rel="icon" href="data:," />
    <title>Hong Kong Stories</title>
  </head>
  <body>
    <div id="stage"></div>

    <header id="hud">
      <span id="place">…</span>
      <span id="coords"></span>
      <button id="bag" type="button" title="物品 / Inventory">🎒</button>
      <span id="build">p6-phaser</span>
    </header>

    <!-- Interaction prompt: what E would do right now. -->
    <div id="prompt" hidden></div>

    <!-- A content-authored line the world hands up: a locked exit, a refused door. -->
    <div id="message" hidden></div>

    <!--
      Cutscene panel: quest nodes of type "cutscene" show one or more localized lines here and wait
      for the player. The quest machine does not advance past them on its own.
    -->
    <section id="cutscene" hidden>
      <div id="cutscene-text"></div>
      <p class="cutscene-hint">按 E / 空白鍵繼續 · press E or Space</p>
    </section>

    <!--
      The conversation panel. In-game text is DOM rather than canvas for the reason the HUD is:
      the browser renders CJK with the bundled pixel font and its fallback chain, and there is no
      glyph rasterisation to get wrong at 12 px.
    -->
    <section id="dialogue" hidden aria-live="polite">
      <header>
        <span id="dialogue-name"></span>
        <span id="dialogue-budget"></span>
      </header>
      <div id="dialogue-log"></div>
      <form id="dialogue-form" autocomplete="off">
        <input id="dialogue-input" type="text" placeholder="問吓佢嘢… / ask anything" />
      </form>
    </section>

    <!--
      Inventory: the bag, with a detail pane. Mirrors the Godot HUD's panel — list, detail, Use
      (gated by the item's own requirements, explained in the content's words), Hold, and an empty
      state that says the bag is empty rather than showing nothing.
    -->
    <section id="inventory" hidden aria-label="inventory">
      <header>
        <span id="inventory-title">物品</span>
        <span id="inventory-held"></span>
        <button id="inventory-close" type="button" aria-label="close">✕</button>
      </header>
      <div id="inventory-body">
        <div id="inventory-list"></div>
        <div id="inventory-detail"></div>
      </div>
      <p class="inventory-hint">I / Esc 關閉 · click an item for details</p>
    </section>

    <!-- Splash: the pack's own opening image. Skippable, and gone once its time is up. -->
    <div id="splash" hidden>
      <img id="splash-art" alt="" />
    </div>

    <!-- Title: gates the world until the player starts. Text and credits come from settings/game.json. -->
    <section id="title" hidden>
      <h1 id="title-name">香港故事</h1>
      <p class="title-sub" id="title-sub">Hong Kong Stories</p>
      <div class="title-actions">
        <button id="title-new" type="button">新遊戲 · New game</button>
        <button id="title-continue" type="button">繼續 · Continue</button>
        <button id="title-credits" type="button">鳴謝 · Credits</button>
      </div>
      <div id="credits" hidden></div>
    </section>

    <!-- Touch controls: only shown on a coarse pointer. -->
    <div id="touch" hidden>
      <button class="dpad up" data-dir="up" type="button" aria-label="up">▲</button>
      <button class="dpad left" data-dir="left" type="button" aria-label="left">◀</button>
      <button class="dpad right" data-dir="right" type="button" aria-label="right">▶</button>
      <button class="dpad down" data-dir="down" type="button" aria-label="down">▼</button>
      <button class="touch-action" data-action="interact" type="button" aria-label="interact">E</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
