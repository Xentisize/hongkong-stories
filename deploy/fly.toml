# Backend on Fly.io (docs/PLAN.md §10.3). Build context is the repo root:
#   fly deploy --dockerfile deploy/Dockerfile --config deploy/fly.toml .
#
# Secrets live in Fly's vault, never in this file:
#   fly secrets set OPENROUTER_API_KEY=... HKS_ADMIN_TOKEN=...
#   fly secrets set HKS_ALLOWED_ORIGINS=https://hongkong-stories.pages.dev
#
# Auto-stop keeps a soft launch near-free; the first request pays a cold start, and the
# game's fallback ladder (§7.4) is designed for exactly that.

app = "hongkong-stories"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  HKS_ALLOWED_ORIGINS = "https://hongkong-stories.pages.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"